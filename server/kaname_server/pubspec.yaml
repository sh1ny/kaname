name: kaname_server
description: Kaname's Serverpod server.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.6.0
  kaname_core:
    path: ../../packages/kaname_core
  kaname_static_data:
    path: ../../packages/kaname_static_data
  kaname_static_data_bundle:
    path: ../../packages/kaname_static_data_bundle
  meta: ^1.19.0
  path: ^1.9.1
  postgres: 3.6.0
  serverpod: 4.1.2
  yaml: ^3.1.3

dev_dependencies:
  # Dev-only: the stream tests drive the app's own, plain-Dart reconnect
  # loop (StaticDataSync) against the real server.
  kaname_app:
    path: ../../app
  kaname_client:
    path: ../kaname_client
  lints: ^6.0.0
  serverpod_cli: 4.1.2
  serverpod_test: 4.1.2
  test: ^1.26.0
