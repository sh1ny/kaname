# Production run mode. The defaults suit the Compose stack in deploy/: the
# database and Redis are the `postgres` and `redis` services (design D9).
# Secrets come from the environment (SERVERPOD_PASSWORD_*), never from this
# file. Insights and the web server are off (design D8).

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: api.examplepod.com
  publicPort: 443
  publicScheme: https

# External PostgreSQL 16 or later.
database:
  host: postgres
  port: 5432
  name: kaname
  user: postgres

# Redis is enabled in every run mode.
redis:
  enabled: true
  host: redis
  port: 6379

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

# The stack logs to the container's stdout only; no persistent session logs
# outside development (design D10).
sessionLogs:
  persistentEnabled: false
  consoleEnabled: true
  consoleLogFormat: json # Defaults to "json", options are "text" or "json"
