# Development run mode. The API, Insights and web servers bind the same ports
# they publish. The database and Redis passwords come from
# config/passwords.yaml, which `mise run server:setup` creates (design D11).

# Configuration for the main API server.
apiServer:
  port: 8080
  publicHost: localhost
  publicPort: 8080
  publicScheme: http

# Insights runs in development only (design D8): the runner and the MCP use it.
insightsServer:
  port: 8081
  publicHost: localhost
  publicPort: 8081
  publicScheme: http

# The web server runs in development only (design D8).
webServer:
  port: 8082
  publicHost: localhost
  publicPort: 8082
  publicScheme: http

# Embedded PostgreSQL: Serverpod starts and manages it in dataPath, which is
# inside the server package and ignored by git.
database:
  host: localhost
  port: 8090
  name: kaname
  user: postgres
  dataPath: .serverpod/development/pgdata

# Redis is enabled in every run mode. In development and test it is the
# container in docker-compose.yaml (design D6).
redis:
  enabled: true
  host: localhost
  port: 8091

maxRequestSize: 524288 # The maximum size of requests allowed in bytes

# Persistent session logs only in development (design D10).
sessionLogs:
  persistentEnabled: true
  consoleEnabled: true
  consoleLogFormat: text # Defaults to "json", options are "text" or "json"
