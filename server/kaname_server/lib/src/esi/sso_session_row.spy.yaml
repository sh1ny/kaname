### Kaname bearer digest only. CCP credentials never enter this table.
class: SsoSessionRow
table: esi_session
serverOnly: true
fields:
  digest: String, unique
  memberId: int
  expiresAt: DateTime
indexes:
  esi_session_identity_idx:
    fields: memberId, expiresAt, id
  esi_session_expiry_idx:
    fields: expiresAt, id
