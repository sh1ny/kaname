name: kaname_ember_ui
description: "Kaname's Ember design system for Flutter: tokens, theme, bundled fonts and a segmented control."
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Geist
      fonts:
        - asset: fonts/Geist[wght].ttf
    - family: Literata
      fonts:
        - asset: fonts/Literata[opsz,wght].ttf
        - asset: fonts/Literata-Italic[opsz,wght].ttf
          style: italic
  assets:
    - fonts/OFL-geist.txt
    - fonts/OFL-literata.txt
