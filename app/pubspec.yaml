name: kaname_app
description: "Kaname: EVE Online corporation and alliance suite (Flutter app)."
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  kaname_ember_ui: ^0.0.1
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  kaname_client: ^0.0.0
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path_provider: ^2.1.6
  http: ^1.6.0
  web: ^1.1.2
  crypto: ^3.0.8
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  kaname_esi: any
  kaname_esi_scheduler: any
  kaname_esi_sso: any
  kaname_esi_vault: any
  sqlite3: 3.9.1
  url_launcher: ^6.3.2
  kaname_static_data_bundle:
    path: ../packages/kaname_static_data_bundle

dev_dependencies:
  jose: ^0.3.5+2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
