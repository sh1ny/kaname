# The app adds flutter_lints on top of the shared root options (design D1).
include:
  - ../analysis_options.yaml
  - package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # gen-l10n output, committed and checked by `mise run l10n:check`.
    - lib/l10n/generated/**
    # Generated platform projects.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
