name: kaname_esi
description: Typed client and route catalogue for EVE Online's ESI, generated from one pinned compatibility date. Sends nothing itself.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

# No runtime dependencies (design D11): the client reaches ESI only through a
# transport its caller injects. A test fails when one is added.

dev_dependencies:
  path: ^1.9.1
  test: ^1.26.0
  yaml: ^3.1.3
