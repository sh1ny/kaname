schema: specwright

context: |
  Kaname (要, "linchpin") is an open-source EVE Online corp/alliance suite: one Flutter app for web, desktop and mobile, a Serverpod 4.1 backend, and a personal console for every pilot. Licence: AGPL-3.0; vendored tooling and fonts retain their own licences.
  The toolchain is pinned in mise.toml (Flutter 3.47.9 / Dart 3.13.7, Node 24, OpenSpec 1.16.0). Always use mise run or mise exec; never inherited Windows tools. WSL Ubuntu on the Linux filesystem is primary development; a separate Windows clone only builds and runs the Windows desktop app and receives changes through GitHub.
  Clean-room product development: never copy third-party product code, schemas or templates. Never commit research about other products; local-only files use .git/info/exclude, not .gitignore. Explicitly licensed tooling skills and the owner's Ember kit are separate authorized assets.
  Read AGENTS.md and matching Dart, Flutter and Serverpod skills before planning or implementing their work; include the rules and skill paths in implementer/reviewer packets. UI work follows DESIGN.md and brand/ with impeccable. Claude plans, OMP implements, OMP launches Claude for cross-model review. Every decision goes to the owner.
  Desktop EVE integration may only read log files and move or resize windows: no synthetic input, input broadcasting, memory reading, client screen capture or global keyboard hooks.
  MANDATORY: Invoke the 'specwright-branch' skill immediately when a new OpenSpec change is started (/opsx:new, /opsx:propose, /opsx:ff, openspec-new-change, openspec-propose, openspec-ff-change) — BEFORE 'openspec new change' runs or any change file is created.
  MANDATORY: Invoke the 'specwright-commit' skill immediately when the OpenSpec apply phase begins (/opsx:apply, openspec-apply-change, 'openspec instructions apply').
  MANDATORY: Before archiving a change (/opsx:archive, /opsx:bulk-archive, openspec-archive-change, 'openspec archive'), read its review.md. If it has a whole line `VERDICT: DEFERRED`, do not archive that change: move nothing, sync no spec, and name its `Deferred to:` targets. In a bulk archive, skip that change and archive the rest. Also read its `tasks.md`: an unticked `[user]` task stops the archive the same way (move nothing, sync no spec, name the waiting tasks; a bulk archive skips that change and archives the rest); a ticked one does not stop it. Verify (/opsx:verify, openspec-verify-change) reports each unticked `[user]` task as waiting on the user and never reports the change verified.
  MANDATORY: Invoke the 'specwright-finish' skill immediately after the OpenSpec archive workflow completes (/opsx:archive, openspec-archive-change, 'openspec archive').
  Project-level planning (strategy, architecture baseline, milestone roadmap) is handled by the 'specwright-roadmap' skill; paths are under project: in openspec/specwright.yaml.
  Specwright settings (finish mode, GitHub identity, review requests, cross-model design review, pre-push validation) live in openspec/specwright.yaml.

