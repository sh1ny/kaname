# Licence policy for pub dependencies, read by `mise run licences`.
#
# allowed: SPDX ids that pass without an exception. Each must be a licence the
#   check knows and that is AGPL-3.0-compatible; anything else is an error.
# exceptions: the only way to accept a package the check would fail. Each entry
#   covers one package at one exact version, records the licence the check
#   found (an SPDX id or `unrecognised`), why the owner accepts it, and the
#   ISO date of the owner's approval. A stale or unneeded entry fails.
#   Only the owner approves exceptions.
#
# Native platform dependencies (Gradle, CocoaPods/SwiftPM, the Flutter
# engine's bundled components) are not checked.
allowed:
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - Zlib
exceptions:
  - package: node_preamble
    version: "2.0.2"
    licence: unrecognised
    reason: "LICENSE holds MIT plus the Dart project's BSD-3-Clause, both allowlisted"
    approved: 2026-11-15
  - package: postgres
    version: "3.6.0"
    licence: unrecognised
    reason: "BSD-3-Clause with the template's placeholders unfilled; through serverpod_database, and a direct dependency of kaname_server since sde-import"
    approved: 2026-11-15
  - package: serverpod
    version: "4.1.2"
    licence: unrecognised
    reason: "Server Side Public License v1 (SSPL); the Serverpod server framework itself, accepted by the owner (ADR 0002; design D13)"
    approved: 2026-11-15
  - package: puppeteer
    version: "3.28.0"
    licence: unrecognised
    reason: "BSD-3-Clause with the template's <organization> placeholder unfilled; dev-only dependency of the grid spike's headless bench runner"
    approved: 2026-11-17
  # Approved by the owner on Ormy item 67, with a forged-token regression.
  - package: jose
    version: "0.3.5+2"
    licence: unrecognised
    reason: "BSD-3-Clause with an unfilled <organization> placeholder"
    approved: 2026-11-25
  - package: crypto_keys
    version: "0.3.1"
    licence: unrecognised
    reason: "BSD-3-Clause with an unfilled <organization> placeholder; dependency of jose"
    approved: 2026-11-25
  - package: x509
    version: "0.2.4+3"
    licence: unrecognised
    reason: "BSD-3-Clause with an unfilled <organization> placeholder; dependency of jose"
    approved: 2026-11-25
