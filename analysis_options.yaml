# Shared analysis options for every Kaname workspace member (design D1).
# Members inherit this file; packages under packages/ include it and add
# public_member_api_docs; app/ includes flutter_lints on top of it.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Vendored skills and the brand kit are not workspace members.
    - .claude/**
    - brand/**
    - "**/build/**"
    - "**/.dart_tool/**"

linter:
  rules:
    - always_declare_return_types
    - directives_ordering
    - prefer_final_in_for_each
    - prefer_final_locals
    - unawaited_futures
