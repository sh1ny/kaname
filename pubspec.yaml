name: kaname_workspace
description: Root pub workspace for Kaname. Not a package of its own.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - app_packages/kaname_ember_ui
  - packages/kaname_core
  - packages/kaname_esi
  - packages/kaname_esi_scheduler
  - packages/kaname_esi_sso
  - packages/kaname_esi_vault
  - packages/kaname_static_data
  - packages/kaname_static_data_bundle
  - server/kaname_client
  - server/kaname_server
  - spikes/kaname_grid_spike
  - tools/kaname_tools

dev_dependencies:
  lints: ^6.0.0

# Patched Windows secure-storage backend: atomic publication and no deletion
# of unreadable data (#49). Pinned to an immutable commit of the owner's fork;
# see THIRD_PARTY_NOTICES for provenance and when to remove this override.
dependency_overrides:
  flutter_secure_storage_windows:
    git:
      url: https://github.com/sh1ny/flutter_secure_storage.git
      ref: f87ea6e365fb321288ef2e9256a8be5a5e3171ca
      path: flutter_secure_storage_windows
