# Toolchain for Kaname. Always use mise (`mise run <task>` or
# `mise exec -- <cmd>`), never a Dart/Flutter from the inherited PATH.
# Flutter 3.47.9 bundles Dart 3.13.7. Serverpod 4.1 needs
# Flutter >= 3.44.4 / Dart >= 3.12.2. Its CLI becomes a package-local
# development dependency in M0, not a global mise tool.
# OpenSpec 1.16.0 is Specwright's exact pin. Java 17 (Temurin) builds
# Android. mise.lock records checksums for every tool; a pin change
# regenerates it (see CONTRIBUTING, Toolchain).

# The oldest mise that reads lockfile format 4, which mise.lock uses.
min_version = "2026.11.1"

[tools]
flutter = "3.47.9"
java = "temurin-17"
node = "24"
"npm:@fission-ai/openspec" = "1.16.0"

[env]
# Keep Specwright's verified native binary local and out of version control.
SPECWRIGHT_HOME = "{{config_root}}/.specwright-local"

[tasks."spec:validate"]
description = "Validate every OpenSpec spec and change"
run = "openspec validate --all --strict"

[tasks."spec:list"]
description = "List OpenSpec changes"
run = "openspec list"

# Workspace tasks. Every entry is one portable command (no shell syntax), so
# the same tasks run on the Windows CI runner.

[tasks.resolve]
description = "Resolve the pub workspace into the root pubspec.lock"
run = "flutter pub get"

[tasks.analyze]
description = "Analyse every workspace member; infos are fatal"
run = "dart analyze --fatal-infos"

[tasks."format:check"]
description = "Fail if any Dart file in a workspace member is unformatted"
# The member directories come from `kaname_tools workspace --format-dirs`, so
# the check follows the workspace list and never touches .claude/ or brand/.
# The list is pasted into the command line, so the tool refuses any member path
# other than `app` or `<package folder>/kaname_<name>` (lower-case letters,
# digits and `_`); then the task fails before running anything.
run = "dart format --output=none --set-exit-if-changed {{ exec(command='mise exec -- dart run kaname_tools workspace --format-dirs') | split(pat='\n') | join(sep=' ') }}"

[tasks."test:core"]
description = "Run the kaname_core tests"
dir = "packages/kaname_core"
run = "dart test"

[tasks."test:tools"]
description = "Run the kaname_tools tests"
dir = "tools/kaname_tools"
run = "dart test"

[tasks."test:app"]
description = "Run the app's widget tests"
dir = "app"
run = "flutter test"

[tasks."test:ember_ui"]
description = "Run the kaname_ember_ui tests"
dir = "app_packages/kaname_ember_ui"
run = "flutter test"

[tasks.test]
description = "Run every workspace member's tests"
run = [
  { task = "test:core" },
  { task = "test:tools" },
  { task = "test:app" },
  { task = "test:ember_ui" },
]

[tasks.workspace]
description = "Check workspace membership, package placement and naming, and required files"
run = "dart run kaname_tools workspace"

[tasks.purity]
description = "Check that packages under packages/ and tools/ stay pure Dart"
run = "dart run kaname_tools purity"

[tasks.notices]
description = "Regenerate the pub dependency section of THIRD_PARTY_NOTICES"
run = "dart run kaname_tools notices --write"

[tasks."notices:check"]
description = "Fail if THIRD_PARTY_NOTICES is stale or misses a vendored source"
run = "dart run kaname_tools notices --check"

[tasks.tokens]
description = "Generate the Ember UI package tokens from brand/tokens.json"
run = "dart run kaname_tools tokens --write"

[tasks."tokens:check"]
description = "Fail if the generated Ember UI tokens are stale or were edited by hand"
run = "dart run kaname_tools tokens --check"

[tasks.licences]
description = "Check that every locked package's licence is allowed by licence-policy.yaml"
run = "dart run kaname_tools licences --check"

[tasks.signoff]
description = "Check DCO sign-off on a branch: mise run signoff -- --base <upstream remote>/main"
# mise appends the arguments after `--` to the command, so --base, --head and
# --pr-author reach kaname_tools. There is no default base (CONTRIBUTING).
run = "dart run kaname_tools signoff"

[tasks.sbom]
description = "Write the CycloneDX SBOM of pubspec.lock to build/sbom/kaname.cdx.json"
run = "dart run kaname_tools sbom --output build/sbom/kaname.cdx.json"

[tasks."build:web"]
description = "Build the app for the web (release, engine bundled) and check that the output is self-contained"
# --no-web-resources-cdn bundles the engine instead of loading it from a CDN;
# webbuild:check fails the build when the output still depends on another host.
# The CI web build and the stack build both go through here or repeat the flag.
run = [
  { task = "build:web:compile" },
  { task = "webbuild:check" },
]

[tasks."build:web:compile"]
description = "Compile the web app in release mode with the engine bundled"
dir = "app"
run = "flutter build web --release --no-web-resources-cdn"

[tasks."webbuild:check"]
description = "Fail unless the built web app in app/build/web loads no engine or font files from other hosts"
run = "dart run kaname_tools webbuild --check app/build/web"

[tasks."server:generate"]
description = "Run the package-local Serverpod code generation for the server and its client"
dir = "server/kaname_server"
run = "dart run serverpod_cli generate"

[tasks."server:drift"]
description = "Fail if the committed Serverpod generated code differs from a fresh generation"
# Regenerates, puts the generated paths in formatter output form, then lists
# every difference from the index (the commit, on a clean checkout).
# `git add --intent-to-add` makes files that generation newly created visible
# to `git diff` (it ignores untracked files). It records only an empty index
# entry: commit the regenerated files, or remove the entries with
# `git reset -- <paths>`. The paths: server/kaname_server/lib/src/generated,
# the generated test tools file (server_test_tools_path) and
# server/kaname_client/lib/src/protocol.
run = [
  { task = "server:generate" },
  "dart format server/kaname_server/lib/src/generated server/kaname_server/test/integration/test_tools/serverpod_test_tools.dart server/kaname_client/lib/src/protocol",
  "git add --intent-to-add -- server/kaname_server/lib/src/generated server/kaname_server/test/integration/test_tools/serverpod_test_tools.dart server/kaname_client/lib/src/protocol",
  "git diff --exit-code --stat=200 -- server/kaname_server/lib/src/generated server/kaname_server/test/integration/test_tools/serverpod_test_tools.dart server/kaname_client/lib/src/protocol",
]

[tasks."server:setup"]
description = "Create the ignored dev/test secrets when missing and derive the dev Redis .env"
dir = "server/kaname_server"
run = "dart run tool/setup.dart"

[tasks."server:dev"]
description = "Start the development server and apply pending migrations; needs the development Redis up"
# Development applies migrations on start (design D1). The stack never does:
# it uses the maintenance step (see the doc comment on `main`).
dir = "server/kaname_server"
run = "dart run bin/main.dart --apply-migrations"

[tasks."test:server"]
description = "Run the server packages' tests; needs the development Redis up (server:setup, then docker compose up -d in server/kaname_server)"
# Starts nothing. `check`'s `test` task does not run these: they need Redis.
# The `stack` tag marks tests that need the Compose stack instead.
run = [
  { task = "test:server:server" },
  { task = "test:server:client" },
]

[tasks."test:server:server"]
description = "Run the kaname_server tests without the stack tag"
dir = "server/kaname_server"
run = "dart test --exclude-tags stack"

[tasks."test:server:client"]
description = "Run the kaname_client tests without the stack tag"
dir = "server/kaname_client"
run = "dart test --exclude-tags stack"

[tasks."stack:up"]
description = "Build the web app, then build and start the self-host stack in deploy/ and wait until it is healthy; needs deploy/.env"
# Caddy serves app/build/web, so the web build comes first. Copy
# deploy/.env.example to deploy/.env and fill it in before the first run.
run = [
  { task = "build:web" },
  "docker compose --file deploy/compose.yaml up --detach --wait --build",
]

[tasks."stack:test"]
description = "Run the stack tests (tag `stack`) against the running stack and build the image from scratch; needs Docker"
# One file at a time: the tests stop and start the stack and build images.
# `stack:up` first (the CI `stack` job does). Not part of `check` or `test:server`.
dir = "server/kaname_client"
run = "dart test --tags stack --concurrency=1"

[tasks."stack:down"]
description = "Stop the self-host stack and delete its data volumes"
# Compose evaluates the required secrets even for `down`, so a checkout without
# deploy/.env still stops the stack; the values are never used.
env = { POSTGRES_PASSWORD = "unused", REDIS_PASSWORD = "unused", SERVERPOD_SERVICE_SECRET = "unused" }
run = "docker compose --file deploy/compose.yaml down --volumes --remove-orphans"

[tasks.check]
description = "Run every local check (resolve first); stops at the first failure"
run = [
  { task = "workspace" },
  { task = "purity" },
  { task = "analyze" },
  { task = "format:check" },
  { task = "tokens:check" },
  { task = "test" },
  { task = "notices:check" },
  { task = "licences" },
]
